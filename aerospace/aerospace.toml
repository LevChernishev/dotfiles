# AeroSpace Configuration
# Documentation: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Автозапуск и горячая перезагрузка
start-at-login = true
auto-reload-config = true

# Интеграция с SketchyBar (мгновенное переключение 1-9 и S с умным Dimming за 2мс)
exec-on-workspace-change = [
    '/Users/lev/.config/sketchybar/bin/space_switch', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh'
]

# Нормализация контейнеров
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Фокус мыши
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = false

# Раскладка QWERTY
key-mapping.preset = 'qwerty'

# Отступы между окнами и экраном (gaps)
gaps.inner.horizontal = 6
gaps.inner.vertical =   6
gaps.outer.left =       6
gaps.outer.bottom =     6
gaps.outer.top =        38
gaps.outer.right =      6

# Автоматически плавающие окна (утилиты, настройки)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.aone.keka'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.postgresapp.Postgres2'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'app.monitorcontrol.MonitorControl'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.nuebling.mac-mouse-fix'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.liguangming.Shadowrocket'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.DiskUtility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.telegram.desktop'
if.window-title-regex-substring = '(Media viewer|Voice Call|Video Call)'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
if.window-title-regex-substring = '(Media viewer|Voice Call|Video Call)'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = 'Picture in picture'
run = 'layout floating'

# Основные горячие клавиши (режим main)
[mode.main.binding]

    # Навигация фокусом (Vim-style)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Перемещение окон (Vim-style)
    alt-shift-h = ['move left', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-j = ['move down', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-k = ['move up', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-l = ['move right', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']

    # Переключение раскладки плитки
    alt-slash = ['layout tiles horizontal vertical', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-comma = ['layout accordion horizontal vertical', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-space = 'layout floating tiling'
    alt-f = 'fullscreen'
    alt-shift-f = 'macos-native-fullscreen'
    alt-b = 'balance-sizes'

    # Изменение размера
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Переключение между рабочими пространствами (1-9)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Перенос окна на выбранное рабочее пространство
    alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']
    alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']

    # Быстрое переключение назад/вперед
    alt-tab = 'workspace-back-and-forth'
    alt-backtick = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Scratchpad (быстрый стол S для фоновых утилит/заметок)
    alt-s = 'workspace S'
    alt-shift-s = ['move-node-to-workspace S', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh']

    # Перезагрузка конфигурации
    alt-shift-r = 'reload-config'

    # Сервисный режим
    alt-shift-semicolon = ['mode service', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=on']

# Сервисный режим (для сброса или точечных действий)
[mode.service.binding]
    esc = ['reload-config', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    f = ['layout floating tiling', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    alt-shift-h = ['join-with left', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    alt-shift-j = ['join-with down', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    alt-shift-k = ['join-with up', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
    alt-shift-l = ['join-with right', 'mode main', 'exec-and-forget /Users/lev/.config/sketchybar/plugins/space_windows.sh', 'exec-and-forget /opt/homebrew/bin/sketchybar --set aerospace_mode drawing=off']
