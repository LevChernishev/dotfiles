# AeroSpace Configuration
# Documentation: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Автозапуск и горячая перезагрузка
start-at-login = true
auto-reload-config = true

# Интеграция с SketchyBar
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Нормализация контейнеров
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Фокус мыши
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = false

# Раскладка QWERTY
key-mapping.preset = 'qwerty'

# Отступы между окнами и экраном (gaps)
gaps.inner.horizontal = 6
gaps.inner.vertical =   6
gaps.outer.left =       6
gaps.outer.bottom =     6
gaps.outer.top =        38
gaps.outer.right =      6

# Автоматически плавающие окна (утилиты, настройки)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.aone.keka'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.postgresapp.Postgres2'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'app.monitorcontrol.MonitorControl'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.nuebling.mac-mouse-fix'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.liguangming.Shadowrocket'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

# Основные горячие клавиши (режим main)
[mode.main.binding]

    # Навигация фокусом (Vim-style)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Перемещение окон (Vim-style)
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Переключение раскладки плитки
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-shift-space = 'layout floating tiling'
    alt-f = 'fullscreen'

    # Изменение размера
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Переключение между рабочими пространствами (1-9)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Перенос окна на выбранное рабочее пространство
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # Быстрое переключение назад/вперед
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Перезагрузка конфигурации
    alt-shift-r = 'reload-config'

    # Сервисный режим
    alt-shift-semicolon = 'mode service'

# Сервисный режим (для сброса или точечных действий)
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
