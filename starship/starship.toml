# Starship Configuration (Catppuccin Mocha themed)
# Documentation: https://starship.rs/config/

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$package\
$golang\
$nodejs\
$rust\
$python\
$docker_context\
$fill\
$cmd_duration\
$line_break\
$character"""

# Заполнитель пространства между левой и правой частью
[fill]
symbol = " "

# Текущая директория
[directory]
style = "bold #89b4fa"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold #f38ba8"

# Git ветка
[git_branch]
symbol = " "
style = "bold #f5c2e7"
format = "[$symbol$branch]($style) "

# Статус Git
[git_status]
style = "bold #f38ba8"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "⚔ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "? "
stashed = "* "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

# Символ строки ввода (❯)
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

# Время выполнения команд (если дольше 2 секунд)
[cmd_duration]
min_time = 2_000
style = "bold #fab387"
format = "[$duration]($style)"

# Языки и окружения (показываются только когда в проекте есть соответствующие файлы)
[nodejs]
symbol = " "
style = "bold #a6e3a1"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #f9e2af"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #89dceb"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #eba0ac"
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold #cdd6f4"
format = "[$symbol$version]($style) "
